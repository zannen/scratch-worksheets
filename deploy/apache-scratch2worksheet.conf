# Apache configuration for the web app, served from /scratch2worksheet/.
#
# Include this inside the site's <VirtualHost>, e.g. in
# /etc/apache2/sites-available/<site>.conf:
#
#     Include /etc/apache2/conf-available/scratch2worksheet.conf
#
# It needs these modules: sudo a2enmod proxy proxy_http ssl headers
# Then check and reload: sudo apache2ctl configtest && sudo systemctl reload apache2

# --- Proxy for the Scratch API -----------------------------------------------------
#
# The page needs each project's details (its title and a short-lived token for
# downloading it) from https://api.scratch.mit.edu/projects/<id>, but the Scratch
# API only lets scratch.mit.edu read its replies. So the page asks this site, at
# scratch-api/projects/<id>, and Apache forwards the request.
#
# Only project numbers are forwarded: this is not an open proxy.

SSLProxyEngine on
SSLProxyVerify require
# The default depth (1) is too small for the Scratch API's certificate chain.
SSLProxyVerifyDepth 5
SSLProxyCACertificateFile /etc/ssl/certs/ca-certificates.crt
SSLProxyCheckPeerName on
SSLProxyCheckPeerExpire on
ProxyRequests off
ProxyPassMatch "^/scratch2worksheet/scratch-api/projects/([0-9]+)/?$" "https://api.scratch.mit.edu/projects/$1" timeout=30

<LocationMatch "^/scratch2worksheet/scratch-api/">
    # Do not pass on anything about the visitor, or this site's cookies.
    RequestHeader unset Cookie
    RequestHeader unset Authorization
    RequestHeader unset Origin
    RequestHeader unset Referer
    # (Headers from the Scratch API are in the "onsuccess" table, and Apache's own
    # in the "always" table, so both are set.)
    Header unset Set-Cookie
    Header always unset Set-Cookie
    # The token in the reply expires after a few minutes.
    Header unset Cache-Control
    Header always set Cache-Control "no-store"
</LocationMatch>

# --- Caching of the page's files ------------------------------------------------------
#
# Browsers may keep using old copies of the JavaScript after an update (fixed by a
# hard refresh, Ctrl+Shift+R). "no-cache" makes them check for a newer version each
# time; unchanged files are not downloaded again.

<LocationMatch "^/scratch2worksheet/(?!scratch-api/)">
    Header set Cache-Control "no-cache"
</LocationMatch>
